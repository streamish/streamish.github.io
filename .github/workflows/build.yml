name: Publish website
on:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  publish:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: music-server/package-lock.json
      - name: Install API dependencies
        run: npm ci
        working-directory: music-server
      - name: Refresh OpenAPI definition
        run: |
          set -euo pipefail
          cd music-server
          setsid npm run start:test > /tmp/streamish-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill -- "-$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:7100/swagger.json \
              -o ../website/swagger.json; then
              node -e "JSON.parse(require('node:fs').readFileSync('../website/swagger.json', 'utf8'))"
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/streamish-api.log
              exit 1
            fi
            sleep 2
          done

          cat /tmp/streamish-api.log
          echo "Timed out waiting for the API Swagger definition."
          exit 1
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html api.html api.js site.css swagger.json _site/
          cp -R fonts _site/
          cp -R icons _site/
          cp -R images _site/
          cp -R screenshots _site/
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages