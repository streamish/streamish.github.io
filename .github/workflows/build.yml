name: Publish website
on:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  publish:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html api.html api.js site.css swagger.json _site/
          cp -R fonts _site/
          cp -R icons _site/
          cp -R images _site/
          cp -R screenshots _site/
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages